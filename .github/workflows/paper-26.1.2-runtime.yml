name: Prepare Paper 26.1.2 Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/paper-26.1.2-runtime.yml"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Prepare and preboot Paper 26.1.2
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p server
          cd server

          curl -L --fail --retry 3             -o paper.jar             "https://fill-data.papermc.io/v1/objects/1d70b1dab9cf4a6de615209a536f3a45a2186240253c428213ce2188ab95e5f7/paper-26.1.2-74.jar"

          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          enable-query=false
          enable-rcon=false
          motd=Kirazium MythicDungeons 26.1.2 Runtime
          max-players=5
          view-distance=3
          simulation-distance=3
          EOF

          # First boot downloads Mojang/server libraries and produces all Paper cache files.
          # Send "stop" after the server has enough time to finish startup.
          ( sleep 35; echo stop ) | timeout 90s java -Xms512M -Xmx1536M -jar paper.jar --nogui || rc=$?
          rc=${rc:-0}
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "Paper preboot failed with exit code $rc"
            exit "$rc"
          fi

          echo "=== Paper preboot files ==="
          find . -maxdepth 3 -type f -printf '%p %s bytes\n' | sort | head -200
          echo "=== latest.log tail ==="
          tail -200 logs/latest.log || true

          # Runtime is valid only if Paper reached the normal server-ready line.
          grep -q 'Done (' logs/latest.log

      - name: Pack offline-capable runtime
        shell: bash
        run: |
          tar -czf paper-26.1.2-runtime.tar.gz server
          ls -lh paper-26.1.2-runtime.tar.gz

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-26.1.2-runtime
          path: paper-26.1.2-runtime.tar.gz
          if-no-files-found: error
          retention-days: 2
